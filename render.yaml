# Render Blueprint: Java API + MySQL. Deploy via Dashboard → New → Blueprint.
services:
  - type: web
    name: bank-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      - key: DB_HOST
        fromService:
          name: bank-mysql
          type: pserv
          property: host
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        value: bankdb
      - key: DB_USER
        value: root
      - key: DB_PASSWORD
        fromService:
          name: bank-mysql
          type: pserv
          envVar: MYSQL_ROOT_PASSWORD

  - type: pserv
    name: bank-mysql
    runtime: image
    image:
      url: mysql:8.0
    plan: free
    envVars:
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true
      - key: MYSQL_DATABASE
        value: bankdb
    # Free MySQL loses data when Render restarts it. For persistence,
    # upgrade this service to Starter+ and uncomment:
    # disk:
    #   name: mysql-data
    #   mountPath: /var/lib/mysql
    #   sizeGB: 1
