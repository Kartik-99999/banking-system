# Render Blueprint: all-in-one free web service (Java API + MySQL, one container).
services:
  - type: web
    name: bank-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    # NOTE: free plan has no persistent disk, so bank data resets whenever
    # Render restarts, sleeps/wakes, or rebuilds this service. Fine for demo.
